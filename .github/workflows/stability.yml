name: Stability

on:
  pull_request:
  workflow_dispatch:
    inputs:
      files:
        description: 'Test entry files, separated by commas or whitespace (tests/name.test.mjs)'
        required: true
        type: string
      repetitions:
        description: 'First attempts per file and OS (1–50; maximum 200 total)'
        default: '50'
        required: true
        type: string
      os:
        description: 'Runner OS'
        default: linux
        type: choice
        options: [linux, windows, both]
      release_mutations:
        description: 'Also prove release test obligation groups against temporary product mutations'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: stability-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-mutations:
    if: github.event_name == 'workflow_dispatch' && inputs.release_mutations
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - run: node scripts/ci/release-test-mutations.mjs
      - name: Restore product bytes independently of the mutation process
        if: always()
        shell: bash
        run: |
          git checkout -- scripts/private-companion
          git diff --exit-code
          git diff --cached --exit-code
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-mutations-${{ runner.os }}
          path: release-mutation-results
          retention-days: 14
          if-no-files-found: error

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
      restic-key: ${{ steps.restic.outputs.key }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - id: plan
        run: node scripts/ci/stability-plan.mjs
      # Populate one checksum-pinned archive before Linux jobs fan out.
      - name: Identify restic archive
        if: steps.plan.outputs.has-work == 'true' && contains(steps.plan.outputs.matrix, 'ubuntu-latest')
        id: restic
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resticPin } from './scripts/linux/restic.mjs';
          const cpu = process.arch, pin = resticPin[cpu];
          if (!['x64', 'arm64'].includes(cpu) || !pin) throw Error('Unsupported restic architecture.');
          const arch = cpu === 'x64' ? 'amd64' : 'arm64';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, [
            'key=restic-linux-' + cpu + '-' + resticPin.version + '-' + pin.archive,
            'url=https://github.com/restic/restic/releases/download/v' + resticPin.version + '/restic_' + resticPin.version + '_linux_' + arch + '.bz2',
            'sha256=' + pin.archive, '',
          ].join('\n'));
          NODE
      - name: Restore restic archive
        if: steps.plan.outputs.has-work == 'true' && contains(steps.plan.outputs.matrix, 'ubuntu-latest')
        id: resticcache
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/restic-archive.bz2
          key: ${{ steps.restic.outputs.key }}
      - name: Download and verify restic archive
        if: steps.plan.outputs.has-work == 'true' && contains(steps.plan.outputs.matrix, 'ubuntu-latest') && steps.resticcache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        env:
          RESTIC_URL: ${{ steps.restic.outputs.url }}
          RESTIC_SHA256: ${{ steps.restic.outputs.sha256 }}
          RESTIC_ARCHIVE: ${{ runner.temp }}/restic-archive.bz2
        run: |
          # One official release fetch; bound DNS/connect and total transfer time.
          # Keep curl diagnostics private because they can contain IP addresses.
          if ! curl --silent --fail --location --connect-timeout 30 --max-time 120 --output "$RESTIC_ARCHIVE" "$RESTIC_URL" 2>/dev/null; then
            echo '::error::Restic release download failed (30s connection / 120s total limit).'
            exit 1
          fi
          if ! printf '%s  %s\n' "$RESTIC_SHA256" "$RESTIC_ARCHIVE" | sha256sum --check --status; then
            echo '::error::Restic archive checksum mismatch; refusing to cache or install.'
            exit 1
          fi
      - name: Save restic archive
        if: steps.plan.outputs.has-work == 'true' && contains(steps.plan.outputs.matrix, 'ubuntu-latest') && steps.resticcache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/restic-archive.bz2
          key: ${{ steps.restic.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stability-plan
          path: stability-plan.json
          retention-days: 14
          if-no-files-found: error

  loop:
    needs: plan
    if: needs.plan.outputs.has-work == 'true'
    name: stability (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      STABILITY_TASK: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      # Linux input setup matches test.yml, once per shard, never per repetition.
      # Windows intentionally retains the Windows slice's pack-free lane policy.
      - name: Identify frozen rollback checkout
        if: runner.os == 'Linux'
        id: frozen
        run: node --input-type=module -e "import fs from 'node:fs'; const pin = JSON.parse(fs.readFileSync('docs/save-surface.json')).frozenRelease; if (!/^[a-f0-9]{40}$/.test(pin)) throw new Error('Invalid frozen pin'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sha=' + pin + '\n');"
      - name: Restore frozen rollback checkout
        if: runner.os == 'Linux'
        id: frozencache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/frozen-rollback
          key: frozen-rollback-${{ runner.os }}-${{ steps.frozen.outputs.sha }}-v1
      - name: Restore packs
        if: runner.os == 'Linux'
        id: packcache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/packs
          key: packs-${{ hashFiles('.github/packs/pack-pin.json') }}
      - name: Fetch and place packs
        if: runner.os == 'Linux'
        id: packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/packs/fetch-packs.mjs . "${{ runner.temp }}/packs"
      - name: Save packs
        if: runner.os == 'Linux' && steps.packs.outputs.fetched == 'true' && steps.packcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/packs
          key: packs-${{ hashFiles('.github/packs/pack-pin.json') }}
      - name: Restore Wiki pages
        if: runner.os == 'Linux'
        id: wikicache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .local/gh-coverage/wiki-open-f2p
          key: wiki-open-f2p-${{ hashFiles('app/datasets/open-f2p/authored/batch.json') }}
      - name: Configure public test inputs
        if: runner.os == 'Linux'
        run: node scripts/ci/coverage-inputs.mjs . "${{ runner.temp }}/packs/tree"
      - name: Save Wiki pages
        if: runner.os == 'Linux' && steps.wikicache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .local/gh-coverage/wiki-open-f2p
          key: wiki-open-f2p-${{ hashFiles('app/datasets/open-f2p/authored/batch.json') }}
      - name: Restore required restic archive
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/restic-archive.bz2
          key: ${{ needs.plan.outputs.restic-key }}
          fail-on-cache-miss: true
      - name: Install checksum-pinned restic for the local encrypted restore test
        if: runner.os == 'Linux'
        run: |
          # Hosted Ubuntu includes these tools. Never refresh apt in a test shard.
          for tool in bzip2 prlimit; do
            command -v "$tool" >/dev/null || { echo "::error::Runner is missing required tool: $tool"; exit 1; }
          done
          sudo "$(command -v node)" scripts/ops/install-restic.mjs --archive-file "${{ runner.temp }}/restic-archive.bz2"
      - name: Linux first attempts
        if: runner.os == 'Linux'
        run: node scripts/ci/stability-run.mjs
        env:
          RS3_FROZEN_CACHE: ${{ runner.temp }}/frozen-rollback
      - name: Windows first attempts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/windows-slice/run.ps1 -Checkout . -Work "${{ runner.temp }}/ws" -Stability
      - name: Cache frozen rollback checkout
        if: runner.os == 'Linux' && steps.frozencache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/frozen-rollback
          key: frozen-rollback-${{ runner.os }}-${{ steps.frozen.outputs.sha }}-v1
      - name: Keep first-attempt receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stability-${{ matrix.id }}
          path: stability-${{ matrix.id }}.json
          retention-days: 14
          if-no-files-found: error

  summary:
    needs: [plan, loop]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has-work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stability-*
          path: stability-results
          merge-multiple: true
      - name: Summarize all planned first attempts
        run: node scripts/ci/stability-summary.mjs stability-results
      - name: Keep aggregate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stability-receipt
          path: stability-receipt.json
          retention-days: 14
          if-no-files-found: error
      - name: Require every shard to succeed
        env:
          LOOP_RESULT: ${{ needs.loop.result }}
        run: test "$LOOP_RESULT" = success

name: Public differential

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Hosted runner tears down this entire container on cancellation/SIGKILL.
    # No pack fetching, inherited service environment or private fixture mounts.
    container: node:24.21.0-bookworm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Trust only this checkout when Git runs without inherited HOME/config.
      - name: Detector integration
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/detectors-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          env -i PATH="$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" Y03_TEST_ARTIFACTS="$RUNNER_TEMP/detectors-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" RS3_COVERAGE_REPORT="$RUNNER_TEMP/differential.json" node scripts/test.mjs differential 2>&1 | tee "$RUNNER_TEMP/detectors-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/integration.log"
      - name: Keep detector per-test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: differential-coverage
          overwrite: true
          path: ${{ runner.temp }}/differential.json
          retention-days: 14
          if-no-files-found: error
      - name: Bounded public smoke
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        timeout-minutes: 3
        shell: bash
        run: |
          calculator_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          env -i PATH="$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" node scripts/experiments/y03-fuzz-ci/supervise.mjs --profile smoke --reference-ref "$calculator_sha" --candidate-ref "$calculator_sha" --out "$RUNNER_TEMP/differential-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Bounded public deep
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        shell: bash
        run: |
          calculator_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          env -i PATH="$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" node scripts/experiments/y03-fuzz-ci/supervise.mjs --profile deep --reference-ref "$calculator_sha" --candidate-ref "$calculator_sha" --out "$RUNNER_TEMP/differential-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Keep public diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-differential-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/differential-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/detectors-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error

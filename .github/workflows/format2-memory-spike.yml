name: Owned format 2 memory spike

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch containing the spike
        required: true
        default: perf/format2-memory-spike
        type: string

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.os }} / fresh run ${{ matrix.run }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        run: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Verify prototype anchors and syntax
        run: node scripts/perf/format2-memory-spike.mjs --check
      - name: One fresh-process comparison
        run: node --expose-gc scripts/perf/format2-memory-spike.mjs --out var/format2-memory-spike/ci
      - name: Preserve measurements even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format2-memory-${{ matrix.os }}-${{ matrix.run }}
          path: |
            var/format2-memory-spike/ci/*.json
            var/format2-memory-spike/ci/*.html
          if-no-files-found: error

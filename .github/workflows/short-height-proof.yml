name: Short-height proof

on:
  pull_request:
    paths:
      - 'app/web/phone-layout.css'
      - 'scripts/perf/short-height-*.mjs'
      - 'scripts/perf/cdp.mjs'
      - 'tests/short-height-browser.test.mjs'
      - 'scripts/ci/short-height-proof.mjs'
      - '.github/workflows/short-height-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: short-height-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - name: First-attempt mutations and three matched timing pairs
        run: node scripts/ci/short-height-proof.mjs "${{ runner.temp }}/short-height-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: short-height-proof
          path: ${{ runner.temp }}/short-height-proof
          retention-days: 14

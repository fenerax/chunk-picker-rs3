name: Roadmap Sync

on:
  issues:
    types: [closed, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: roadmap-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Sync roadmap status') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Fetch linked issue states
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nums=$(node scripts/sync-roadmap.mjs --list-issues)
          node --input-type=module -e '
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";
          const numbers = JSON.parse(process.argv[1]);
          const repo = process.env.GITHUB_REPOSITORY;
          const issues = [];
          for (const number of numbers) {
            const raw = execFileSync("gh", ["api", `repos/${repo}/issues/${number}`], { encoding: "utf8" });
            const parsed = JSON.parse(raw);
            issues.push({ number: parsed.number, state: parsed.state, closedAt: parsed.closed_at ?? null });
          }
          writeFileSync("/tmp/roadmap-issues.json", JSON.stringify(issues));
          ' "$nums"
      - name: Sync roadmap.json
        run: node scripts/sync-roadmap.mjs --issues-json /tmp/roadmap-issues.json --write
      - name: Verify full CI gate and push if changed
        run: |
          if git diff --quiet app/data/roadmap.json; then
            echo "Roadmap already up to date."
            exit 0
          fi
          git config user.name "fenerax"
          git config user.email "fenerax@users.noreply.github.com"
          git add app/data/roadmap.json
          git commit -m "Sync roadmap status with GitHub issues"
          node scripts/secret-scan/scan.mjs --without-corpus --tree HEAD --commits HEAD~1..HEAD
          npm test
          git push origin HEAD:main

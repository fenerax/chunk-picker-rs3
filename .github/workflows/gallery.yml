name: Gallery

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push or pull request update cancels the older run for the same ref.
# Main keeps one run per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A push to a branch with an open pull request skips the jobs below: the
  # pull_request run tests the same head merged with main. Main, tags, branches
  # with no open pull request and fork pull requests always run. An API error
  # runs the jobs.
  gate:
    name: gate (gallery)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            open=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" --jq length 2>/dev/null || echo 0)
            if [ "${open:-0}" -gt 0 ] 2>/dev/null; then run=false; fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  gallery:
    name: gallery
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Packs come from the release assets that .github/packs/pack-pin.json names.
      # With no pin, nothing is fetched and the tests that need pack or
      # game-cache files skip.
      - name: Restore packs
        id: packcache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/packs
          key: packs-${{ hashFiles('.github/packs/pack-pin.json') }}
      - name: Fetch and place packs
        id: packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/packs/fetch-packs.mjs . "${{ runner.temp }}/packs"
      - name: Save packs
        if: steps.packs.outputs.fetched == 'true' && steps.packcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/packs
          key: packs-${{ hashFiles('.github/packs/pack-pin.json') }}
      - name: Check gallery
        run: node scripts/ci/gallery-check.mjs --output "${{ runner.temp }}/gallery"
      - name: Keep the summary and failure screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gallery-check
          path: |
            ${{ runner.temp }}/gallery/summary.json
            ${{ runner.temp }}/gallery/failures/*.png
          retention-days: 14
          if-no-files-found: ignore

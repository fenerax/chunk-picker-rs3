name: Public Docker envelope controls

on:
  push:
    branches: [codex/perf-harness-assets-20261023]
    paths:
      - .github/workflows/public-container-envelope.yml
      - docs/research/codex-cloud-runner/**
      - docs/research/codex-cloud-capture/**

permissions:
  contents: read

concurrency:
  group: public-docker-envelope
  cancel-in-progress: false

jobs:
  controls:
    if: github.repository == 'fenerax/chunk-picker-rs3' && github.event.repository.private == false && github.ref == 'refs/heads/codex/perf-harness-assets-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: inputs/assets
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 6f22fefa782747790e2eaefa01e4e5ea7b557323
          path: inputs/source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare public inputs and exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/inputs/assets/docs/research/codex-cloud-runner"
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B "$tool/prepare_public.py" --checkout "$GITHUB_WORKSPACE/inputs/source" --commit 6f22fefa782747790e2eaefa01e4e5ea7b557323 --output "$RUNNER_TEMP/public-source"
          python3 -B "$tool/prepare_public.py" --checkout "$GITHUB_WORKSPACE/inputs/assets" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/public-harness"
          mkdir -m 700 "$RUNNER_TEMP/deps" "$RUNNER_TEMP/npm-home" "$RUNNER_TEMP/npm-config" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/pull-config"
          cp "$tool/package.json" "$tool/package-lock.json" "$RUNNER_TEMP/deps/"
          cp "$(command -v node)" "$RUNNER_TEMP/runtime/node"
          : > "$RUNNER_TEMP/npm-config/empty-user.npmrc"
          : > "$RUNNER_TEMP/npm-config/empty-global.npmrc"
          setup_status=0
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/npm-home" npm_config_userconfig="$RUNNER_TEMP/npm-config/empty-user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/npm-config/empty-global.npmrc" npm_config_cache="$RUNNER_TEMP/npm-home/cache" npm_config_registry=https://registry.npmjs.org/ npm_config_update_notifier=false npm ci --prefix "$RUNNER_TEMP/deps" --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/npm-setup.log" 2>&1 || setup_status=$?
          if [ "$setup_status" -ne 0 ]; then
            python3 -B "$tool/setup_diagnostics.py" --stage dependency-setup --exit-code "$setup_status" --log "$RUNNER_TEMP/npm-setup.log"
            exit "$setup_status"
          fi
          image=$(python3 -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$tool/pins.json")
          setup_status=0
          docker --host unix:///var/run/docker.sock --config "$RUNNER_TEMP/pull-config" pull --platform linux/amd64 "$image" > "$RUNNER_TEMP/image-pull.log" 2>&1 || setup_status=$?
          if [ "$setup_status" -ne 0 ]; then
            python3 -B "$tool/setup_diagnostics.py" --stage public-image-pull --exit-code "$setup_status" --log "$RUNNER_TEMP/image-pull.log"
            exit "$setup_status"
          fi
          printf '{"stage":"public-setup","passed":true}\n'
      - name: Pure safety controls
        working-directory: inputs/assets/docs/research/codex-cloud-runner
        shell: bash
        run: |
          pure_status=0
          python3 -B -m unittest -q test_docker_envelope.py > "$RUNNER_TEMP/pure-controls.log" 2>&1 || pure_status=$?
          if [ "$pure_status" -ne 0 ]; then
            python3 -B setup_diagnostics.py --stage pure-controls --exit-code "$pure_status" --log "$RUNNER_TEMP/pure-controls.log"
            exit "$pure_status"
          fi
          printf '{"stage":"pure-controls","passed":true,"count":52}\n'
      - name: Positive, CPU, memory, and missing-init remote controls
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/inputs/assets/docs/research/codex-cloud-runner"
          export PYTHONDONTWRITEBYTECODE=1
          for control in positive cpu memory missing-init; do
            python3 -B "$tool/docker_envelope.py" --execute --remote-only-ack remote-disposable-public --source "$RUNNER_TEMP/public-source" --harness "$RUNNER_TEMP/public-harness" --harness-commit "$GITHUB_SHA" --deps "$RUNNER_TEMP/deps" --node "$RUNNER_TEMP/runtime/node" --output "$RUNNER_TEMP/envelope-$control" --control "$control" --mode component --seconds 35
          done
      # Deliberately no cache, upload-artifact, private pack fetch, tokens, or secret contexts.

  one-case:
    needs: controls
    # Prepared for root review. Flip this only after the remote controls and exact capture
    # source have been reviewed and the root authorizes the measured one-case run.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: inputs/assets
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 6f22fefa782747790e2eaefa01e4e5ea7b557323
          path: inputs/source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare exact public execution inputs
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/inputs/assets/docs/research/codex-cloud-runner"
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B "$tool/prepare_public.py" --checkout "$GITHUB_WORKSPACE/inputs/source" --commit 6f22fefa782747790e2eaefa01e4e5ea7b557323 --output "$RUNNER_TEMP/public-source"
          python3 -B "$tool/prepare_public.py" --checkout "$GITHUB_WORKSPACE/inputs/assets" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/public-harness"
          mkdir -m 700 "$RUNNER_TEMP/deps" "$RUNNER_TEMP/npm-home" "$RUNNER_TEMP/npm-config" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/pull-config"
          cp "$tool/package.json" "$tool/package-lock.json" "$RUNNER_TEMP/deps/"
          cp "$(command -v node)" "$RUNNER_TEMP/runtime/node"
          : > "$RUNNER_TEMP/npm-config/empty-user.npmrc"
          : > "$RUNNER_TEMP/npm-config/empty-global.npmrc"
          setup_status=0
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/npm-home" npm_config_userconfig="$RUNNER_TEMP/npm-config/empty-user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/npm-config/empty-global.npmrc" npm_config_cache="$RUNNER_TEMP/npm-home/cache" npm_config_registry=https://registry.npmjs.org/ npm_config_update_notifier=false npm ci --prefix "$RUNNER_TEMP/deps" --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/npm-setup.log" 2>&1 || setup_status=$?
          if [ "$setup_status" -ne 0 ]; then
            python3 -B "$tool/setup_diagnostics.py" --stage dependency-setup --exit-code "$setup_status" --log "$RUNNER_TEMP/npm-setup.log"
            exit "$setup_status"
          fi
          image=$(python3 -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$tool/pins.json")
          setup_status=0
          docker --host unix:///var/run/docker.sock --config "$RUNNER_TEMP/pull-config" pull --platform linux/amd64 "$image" > "$RUNNER_TEMP/image-pull.log" 2>&1 || setup_status=$?
          if [ "$setup_status" -ne 0 ]; then
            python3 -B "$tool/setup_diagnostics.py" --stage public-image-pull --exit-code "$setup_status" --log "$RUNNER_TEMP/image-pull.log"
            exit "$setup_status"
          fi
          printf '{"stage":"public-setup","passed":true}\n'
      - name: One independent reference and one measured frozen browser case
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/inputs/assets/docs/research/codex-cloud-runner"
          python3 -B "$tool/docker_envelope.py" --execute --remote-only-ack remote-disposable-public --source "$RUNNER_TEMP/public-source" --harness "$RUNNER_TEMP/public-harness" --harness-commit "$GITHUB_SHA" --deps "$RUNNER_TEMP/deps" --node "$RUNNER_TEMP/runtime/node" --output "$RUNNER_TEMP/frozen-one-case" --mode browser --seconds 540 --entrypoint docs/research/codex-cloud-capture/run-frozen-browser.mjs --arg=--source --arg=/source --arg=--source-lock --arg=/scratch/source-lock.json --arg=--scratch --arg=/scratch --arg=--deps --arg=/deps --arg=--member --arg=explorer-1 --arg=--group --arg=false --arg=--chunk --arg=12850 --arg=--startup --arg=immediate --arg=--out --arg=/scratch/case-result.json
      # Raw private capture remains on the ephemeral runner; only the wrapper's closed JSON projection is logged.

# Additional jobs mapping entry; R116 one-case remains unchanged and disabled.
  r127-component:
    needs: controls
    # Keep disabled until all four remote Docker controls PASS and root authorizes R127.
    # Merge the reviewed R127 result-policy additions before enabling this job.
    if: ${{ false }}
    runs-on: ubuntu-24.04

    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: inputs/assets
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 6f22fefa782747790e2eaefa01e4e5ea7b557323
          path: inputs/source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Prepare public inputs and exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/inputs/assets/docs/research/codex-cloud-runner"
          export PYTHONDONTWRITEBYTECODE=1
          python3 -B "$tool/prepare_public.py" --checkout "$GITHUB_WORKSPACE/inputs/source" --commit 6f22fefa782747790e2eaefa01e4e5ea7b557323 --output "$RUNNER_TEMP/public-source"
          python3 -B "$tool/prepare_public.py" --checkout "$GITHUB_WORKSPACE/inputs/assets" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/public-harness"
          mkdir -m 700 "$RUNNER_TEMP/deps" "$RUNNER_TEMP/npm-home" "$RUNNER_TEMP/npm-config" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/pull-config"
          cp "$tool/package.json" "$tool/package-lock.json" "$RUNNER_TEMP/deps/"
          cp "$(command -v node)" "$RUNNER_TEMP/runtime/node"
          : > "$RUNNER_TEMP/npm-config/empty-user.npmrc"
          : > "$RUNNER_TEMP/npm-config/empty-global.npmrc"
          setup_status=0
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/npm-home" npm_config_userconfig="$RUNNER_TEMP/npm-config/empty-user.npmrc" npm_config_globalconfig="$RUNNER_TEMP/npm-config/empty-global.npmrc" npm_config_cache="$RUNNER_TEMP/npm-home/cache" npm_config_registry=https://registry.npmjs.org/ npm_config_update_notifier=false npm ci --prefix "$RUNNER_TEMP/deps" --ignore-scripts --omit=optional --no-audit --no-fund > "$RUNNER_TEMP/npm-setup.log" 2>&1 || setup_status=$?

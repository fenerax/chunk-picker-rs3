          if [ "$setup_status" -ne 0 ]; then
            python3 -B "$tool/setup_diagnostics.py" --stage public-image-pull --exit-code "$setup_status" --log "$RUNNER_TEMP/image-pull.log"
            exit "$setup_status"
          fi
          printf '{"stage":"public-setup","passed":true}\n'
      - name: R127 full public component comparison
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/inputs/assets/docs/research/codex-cloud-runner"
          python3 -B "$tool/docker_envelope.py" --execute --remote-only-ack remote-disposable-public --source "$RUNNER_TEMP/public-source" --harness "$RUNNER_TEMP/public-harness" --harness-commit "$GITHUB_SHA" --deps "$RUNNER_TEMP/deps" --node "$RUNNER_TEMP/runtime/node" --output "$RUNNER_TEMP/r127-component" --mode component --seconds 240 --entrypoint docs/research/codex-cloud-assets/r127/container-entry.mjs --arg=--source --arg=/source --arg=--scratch --arg=/scratch --arg=--source-lock --arg=/scratch/source-lock.json --arg=--authorized-full-public
      # Detailed results remain on the ephemeral runner; only the closed envelope JSON is logged.

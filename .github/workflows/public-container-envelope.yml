name: Public Docker envelope controls

on:
  push:
    branches: [codex/perf-harness-assets-20261023]
    paths:
      - .github/workflows/public-container-envelope.yml
      - docs/research/codex-cloud-runner/**
      - docs/research/codex-cloud-capture/**

permissions:
  contents: read

concurrency:
  group: public-docker-envelope-${{ github.sha }}
  cancel-in-progress: false

jobs:
  controls:
    if: github.repository == 'fenerax/chunk-picker-rs3' && github.event.repository.private == false && github.ref == 'refs/heads/codex/perf-harness-assets-20261023'

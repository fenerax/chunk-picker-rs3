name: Owned format 2 acceptance

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Diagnostic pair or full final acceptance matrix
        type: choice
        options: [diagnostic, full]
        default: diagnostic
      snapshots:
        description: Capture a separate reduced synthetic dominator spot check
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.os }} / fresh run ${{ matrix.run }} / ${{ matrix.format }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.scope == 'full' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        run: ${{ fromJSON(inputs.scope == 'full' && '[1,2,3,4,5]' || '[1]') }}
        format: [format1, format2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Measure one format in a fresh process
        shell: bash
        env:
          ACCEPTANCE_SCOPE: ${{ inputs.scope }}
          ACCEPTANCE_FRESH_RUN: ${{ matrix.run }}
          ACCEPTANCE_FORMAT: ${{ matrix.format }}
        run: |
          node scripts/perf/owned-acceptance.mjs --format "$ACCEPTANCE_FORMAT" --out var/owned-acceptance/ci
      - name: Publish human summary
        if: always()
        shell: bash
        run: |
          if [ -f var/owned-acceptance/ci/summary.txt ]; then
            cat var/owned-acceptance/ci/summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve results and outlier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-acceptance-${{ matrix.os }}-${{ matrix.run }}-${{ matrix.format }}
          path: |
            var/owned-acceptance/ci/**/*.json
            var/owned-acceptance/ci/**/*.txt
            var/owned-acceptance/ci/**/*.error
          if-no-files-found: error
          retention-days: 14
  summarize:
    name: Compare both formats for the requested scope
    if: always()
    needs: measure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: owned-acceptance-*
          path: var/owned-acceptance-receipts
      - name: Require every receipt and pool time percentiles by OS
        env:
          ACCEPTANCE_SCOPE: ${{ inputs.scope }}
        run: node scripts/perf/owned-acceptance/aggregate.mjs var/owned-acceptance-receipts
      - name: Preserve aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-acceptance-aggregate
          path: var/owned-acceptance-receipts/aggregate.json
          if-no-files-found: error

  spot-check:
    name: Separate reduced dominator evidence (no acceptance claim)
    if: always() && inputs.snapshots
    needs: summarize
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      - name: Capture reduced synthetic snapshots under the ordinary ceilings
        env:
          ACCEPTANCE_SCOPE: diagnostic
        run: node scripts/perf/owned-acceptance.mjs --spot-check --snapshots --format format2 --out var/owned-snapshot-spot-check
      - name: Preserve spot-check evidence separately from measured receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: owned-dominator-spot-check
          path: var/owned-snapshot-spot-check
          if-no-files-found: error
          retention-days: 14
